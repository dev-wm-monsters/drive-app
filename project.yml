# XcodeGen spec for DriveApp. The .xcodeproj is generated, never committed:
#   brew install xcodegen && xcodegen generate
# scripts/build-dmg.sh does this on the CI runner.
#
# Identity lives in ONE place: settings.base below (APP_NAME, APP_BUNDLE_ID).
# Targets derive their names and bundle IDs from it via $(...) substitution.
# Change the product name / bundle ID here only.

name: DriveApp

options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    APP_NAME: DriveApp
    APP_BUNDLE_ID: com.wakeupmonster.driveapp.dev
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: "YES"
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 1
    # Empty = local builds sign ad-hoc ("Sign to Run Locally"). CI injects the
    # team from the APPLE_TEAM_ID secret for signed builds.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

# --- B01: local Swift package ---------------------------------------------
packages:
  StorageCore:
    path: Packages/StorageCore

targets:
  DriveApp:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "B01/*.md"
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: $(APP_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        DriveAppStorageMachService: $(DEVELOPMENT_TEAM).$(APP_BUNDLE_ID).storage
        DriveAppTeamID: $(DEVELOPMENT_TEAM)
        DriveAppBaseBundleID: $(APP_BUNDLE_ID)
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: App/DriveApp.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: App/Info.plist
        ENABLE_PREVIEWS: "NO"
    # --- B01: embed the FSKit extension and the storage service ------------
    dependencies:
      - package: StorageCore
      - target: DriveAppFS
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(EXTENSIONS_FOLDER_PATH)  # DriveApp.app/Contents/Extensions
      - target: DriveAppStorageService
        embed: true
        codeSign: true
        copy:
          destination: executables  # DriveApp.app/Contents/MacOS
    postBuildScripts:
      - path: StorageService/generate-launchagent-plist.sh
        name: Generate StorageService LaunchAgent plist
        shell: /bin/sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/$(APP_BUNDLE_ID).storageservice.plist

  # Every non-app target MUST set SKIP_INSTALL: "YES", or `xcodebuild archive`
  # produces a generic archive and the DMG export fails.

  # FSKit module (ExtensionKit). Info.plist is hand-written (EXAppExtension-
  # Attributes), so no `info:` block here: XcodeGen would overwrite it.
  DriveAppFS:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: FileSystemExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    dependencies:
      - package: StorageCore
    settings:
      base:
        PRODUCT_NAME: DriveAppFS
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).fsext
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: FileSystemExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FileSystemExtension/DriveAppFS.entitlements
        ENABLE_APP_SANDBOX: "YES"
        SKIP_INSTALL: "YES"

  # StorageService: CLI tool launched as a LaunchAgent via SMAppService.
  # PRODUCT_NAME is referenced by the generated LaunchAgent plist; keep it.
  DriveAppStorageService:
    type: tool
    platform: macOS
    sources:
      - path: StorageService
        excludes:
          - "Info.plist"
          - "*.entitlements"
          - "*.sh"
      - path: Shared
    dependencies:
      - package: StorageCore
    settings:
      base:
        PRODUCT_NAME: DriveAppStorageService
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).storageservice
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: StorageService/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        CODE_SIGN_ENTITLEMENTS: StorageService/DriveAppStorageService.entitlements
        ENABLE_APP_SANDBOX: "NO"  # see the entitlements file header
        SKIP_INSTALL: "YES"

schemes:
  DriveApp:
    build:
      targets:
        DriveApp: all
        DriveAppFS: all
        DriveAppStorageService: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
