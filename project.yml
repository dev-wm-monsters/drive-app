# XcodeGen spec for DriveApp. The .xcodeproj is generated, never committed:
#   brew install xcodegen && xcodegen generate
# scripts/build-dmg.sh does this on the CI runner.
#
# Identity and configuration live in ONE place: settings.base below.
# Targets derive their names, bundle IDs, App Group and Info.plist values from
# it via $(...) substitution. Change the product name, bundle ID, Google client
# or Drive root here only (CI may override them on the xcodebuild command line).
#
# Targets:
#   DriveApp             menu-bar app (LSUIElement), sandboxed
#   DriveAppFileProvider File Provider extension (NSFileProviderReplicatedExtension),
#                        embedded at DriveApp.app/Contents/PlugIns/DriveAppFileProvider.appex
# Both link the local Swift package Packages/DriveCore and compile App/Shared.

name: DriveApp

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # --- Identity (single source) -------------------------------------------
    APP_NAME: DriveApp
    APP_BUNDLE_ID: com.wakeupmonster.driveapp.dev
    # --- Google OAuth ("iOS" client type bound to APP_BUNDLE_ID) -------------
    # Placeholders: the founder supplies real values; CI overrides them.
    # GOOGLE_REVERSED_CLIENT_ID is the client ID with its dot-separated parts
    # reversed (com.googleusercontent.apps.<id>); the redirect URI is
    # <GOOGLE_REVERSED_CLIENT_ID>:/oauth2redirect.
    GOOGLE_CLIENT_ID_MAC: ""
    GOOGLE_REVERSED_CLIENT_ID: ""
    # --- Drive root ------------------------------------------------------------
    # A non-empty DRIVE_ROOT_FOLDER_ID overrides the shared drive name.
    DRIVE_ROOT_SHARED_DRIVE_NAME: WakeupMonster
    DRIVE_ROOT_FOLDER_ID: ""
    # --- Build -----------------------------------------------------------------
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "YES"
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 1
    # Empty = local builds sign ad-hoc ("Sign to Run Locally"). CI injects the
    # team from the APPLE_TEAM_ID secret for signed builds. The App Group
    # (and therefore the shared keychain group) is $(DEVELOPMENT_TEAM).$(APP_BUNDLE_ID).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    # Developer ID provisioning profiles (UUID or name); empty = none.
    # scripts/build-dmg.sh sets them on the xcodebuild command line for signed
    # builds; each target maps its own to PROVISIONING_PROFILE_SPECIFIER below.
    # The shared token store uses the data-protection keychain, which on macOS
    # needs entitlements authorised by a profile (see App/Shared/KeychainTokenStore.swift).
    DRIVEAPP_APP_PROFILE: ""
    DRIVEAPP_EXT_PROFILE: ""

packages:
  DriveCore:
    path: Packages/DriveCore

targets:
  DriveApp:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: DriveCore
      # app-extension default: "Embed Foundation Extensions" phase into
      # $(PLUGINS_FOLDER_PATH) = Contents/PlugIns, code-signed on copy.
      - target: DriveAppFileProvider
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: $(APP_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        # Read by DriveConfig.fromInfoDictionary (Packages/DriveCore).
        GoogleClientID: $(GOOGLE_CLIENT_ID_MAC)
        GoogleReversedClientID: $(GOOGLE_REVERSED_CLIENT_ID)
        DriveRootSharedDriveName: $(DRIVE_ROOT_SHARED_DRIVE_NAME)
        DriveRootFolderID: $(DRIVE_ROOT_FOLDER_ID)
        DriveAppGroup: $(DEVELOPMENT_TEAM).$(APP_BUNDLE_ID)
        # No CFBundleURLTypes: ASWebAuthenticationSession captures the
        # <reversed client id>:/oauth2redirect callback itself.
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: App/DriveApp.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: App/Info.plist
        ENABLE_PREVIEWS: "NO"
        PROVISIONING_PROFILE_SPECIFIER: $(DRIVEAPP_APP_PROFILE)

  # Every non-app target MUST set SKIP_INSTALL: "YES", or `xcodebuild archive`
  # produces a generic archive and the DMG export fails.
  DriveAppFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: FileProviderExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: App/Shared
    dependencies:
      - package: DriveCore
    info:
      path: FileProviderExtension/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: $(APP_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        GoogleClientID: $(GOOGLE_CLIENT_ID_MAC)
        GoogleReversedClientID: $(GOOGLE_REVERSED_CLIENT_ID)
        DriveRootSharedDriveName: $(DRIVE_ROOT_SHARED_DRIVE_NAME)
        DriveRootFolderID: $(DRIVE_ROOT_FOLDER_ID)
        DriveAppGroup: $(DEVELOPMENT_TEAM).$(APP_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: $(DEVELOPMENT_TEAM).$(APP_BUNDLE_ID)
          NSExtensionFileProviderSupportsEnumeration: true
    settings:
      base:
        PRODUCT_NAME: DriveAppFileProvider
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).fileprovider
        CODE_SIGN_ENTITLEMENTS: FileProviderExtension/DriveAppFileProvider.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: FileProviderExtension/Info.plist
        PROVISIONING_PROFILE_SPECIFIER: $(DRIVEAPP_EXT_PROFILE)
        SKIP_INSTALL: "YES"

schemes:
  DriveApp:
    build:
      targets:
        DriveApp: all
        DriveAppFileProvider: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
