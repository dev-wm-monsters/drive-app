# Core tests: runs the platform-independent unit tests on Linux for every pull
# request that touches the shared logic, and on demand.
#   - swift:  Packages/DriveCore (swift test) in the official Swift 6.2 image
#   - dotnet: builds every project in windows/ (EnableWindowsTargeting) and
#             runs windows/tests/DriveSync.Core.Tests
# Linux runners only (cheap). Nothing is uploaded or published.

name: Core tests

on:
  pull_request:
    paths:
      - "Packages/DriveCore/**"
      - "windows/**"
      - "spec/**"
      - ".github/workflows/core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the older run.
concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: DriveCore (swift test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # swift:6.2.4-noble, pinned by index digest (checked 24 Nov 2026).
      image: swift:6.2.4-noble@sha256:576698469fd3cf95b2abdeb91a7571d3afcd91806c87283dd01d564803554c0f
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --package-path Packages/DriveCore

      - name: Test
        run: swift test --package-path Packages/DriveCore

  dotnet:
    name: Windows core (dotnet test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Build all Windows projects (Windows targeting packs, no native code runs)
        run: |
          set -euo pipefail
          shopt -s nullglob
          solutions=(windows/*.sln)
          if [[ ${#solutions[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one solution in windows/, found ${#solutions[@]}."
            exit 1
          fi
          dotnet build "${solutions[0]}" -c Release -p:EnableWindowsTargeting=true

      - name: Test DriveSync.Core
        run: >-
          dotnet test windows/tests/DriveSync.Core.Tests/DriveSync.Core.Tests.csproj
          -c Release -p:EnableWindowsTargeting=true
          --logger "console;verbosity=normal"
